[package]
name = "zvs-napi"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
debug-panic = []

[dependencies]
futures.workspace = true
serde.workspace = true
napi.workspace = true
napi-derive.workspace = true
serde_json.workspace = true
zvs-core = { path = "../zvs-core" }

[build-dependencies]
napi-build.workspace = true

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "deny"
