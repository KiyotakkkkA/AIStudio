[package]
name = "zvs-host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
testing = []
debug-panic = []

[dependencies]
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
async-trait.workspace = true
base64.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
futures.workspace = true
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs"] }
mail-parser = { version = "=1.0.1", features = ["full_encoding"] }
notify.workspace = true
portable-pty.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["system-proxy", "json"] }
rmcp.workspace = true
rusqlite.workspace = true
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "=0.8.5"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sse-stream.workspace = true
sysinfo.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tiktoken-rs = { version = "=0.12.1", default-features = false }
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "process", "io-util", "net"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }
zeroize.workspace = true
zvs-contract = { path = "../zvs-contract", features = ["schema"] }
zvs-core = { path = "../zvs-core" }
zvs-openai = { path = "../zvs-openai" }
zvs-pipe = { path = "../zvs-pipe" }
zvs-copilot = { path = "../zvs-copilot" }
zvs-qwen-web = { path = "../zvs-qwen-web" }
zvs-zai-web = { path = "../zvs-zai-web" }
axum.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "test-util", "net", "sync", "process", "io-util"] }

[lints]
workspace = true
