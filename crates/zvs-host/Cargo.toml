[package]
name = "zvs-host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
testing = ["dep:tempfile"]
debug-panic = []

[dependencies]
async-trait.workspace = true
futures.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["system-proxy"] }
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "process", "io-util"] }
tokio-util.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v7"] }
zeroize.workspace = true
zvs-contract = { path = "../zvs-contract", features = ["schema"] }
zvs-core = { path = "../zvs-core" }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "test-util", "net", "sync", "process", "io-util"] }

[lints]
workspace = true
