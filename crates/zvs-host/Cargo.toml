[package]
name = "zvs-host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
testing = []
debug-panic = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
futures.workspace = true
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
notify.workspace = true
portable-pty.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["system-proxy", "json"] }
rmcp.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sse-stream.workspace = true
sysinfo.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "process", "io-util", "net"] }
tokio-util.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }
zeroize.workspace = true
zvs-contract = { path = "../zvs-contract", features = ["schema"] }
zvs-core = { path = "../zvs-core" }
zvs-openai = { path = "../zvs-openai" }
zvs-qwen-web = { path = "../zvs-qwen-web" }
zvs-zai-web = { path = "../zvs-zai-web" }
axum.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "test-util", "net", "sync", "process", "io-util"] }

[lints]
workspace = true
