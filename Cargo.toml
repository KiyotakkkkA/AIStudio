[workspace]
resolver = "2"
members = ["crates/zvs-core", "crates/zvs-jobd", "crates/zvs-napi"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
futures = "=0.3.32"
lancedb = { version = "=0.38.0", features = ["remote"] }
serde = { version = "=1.0.228", features = ["derive"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
blake3 = "=1.8.7"
pdf-extract = "=0.12.0"
napi = { version = "=3.12.4", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "=3.6.5"
napi-build = "=2.4.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2", "charset"] }
sha2 = "=0.11.0"
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio-util = { version = "=0.7.19", features = ["rt"] }
unicode-segmentation = "=1.13.3"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
