[workspace]
resolver = "2"
members = ["crates/zvs-core", "crates/zvs-napi"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
blake3 = "=1.8.7"
napi = { version = "=3.12.4", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "=3.6.5"
napi-build = "=2.4.2"
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio-util = { version = "=0.7.19", features = ["rt"] }
unicode-segmentation = "=1.13.3"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
