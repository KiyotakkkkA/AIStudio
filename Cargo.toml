[workspace]
resolver = "2"
members = ["crates/zvs-core"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
blake3 = "=1.8.7"
thiserror = "=2.0.20"
tokio-util = { version = "=0.7.19", features = ["rt"] }
unicode-segmentation = "=1.13.3"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
