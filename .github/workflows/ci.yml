name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Unit gates run on Linux because they are faster and cheaper. The Tauri shell, its build and
# the e2e suite run on Windows because Windows is the only verified target (PASSPORT §18.3).
jobs:
  linux:
    name: Rust · typecheck · lint · test · format (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.1"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --exclude zvs-studio --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --exclude zvs-studio --all-features
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: node scripts/contract-channels.mjs --check
      - run: pnpm exec knip --include files,dependencies,devDependencies,unlisted,binaries,unresolved
      - run: pnpm test:coverage
      - run: pnpm format:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  windows:
    name: Tauri shell · clippy · test · build · e2e (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.1"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "studio^..." build
      - run: pnpm --filter studio build:web
      - run: cargo clippy --locked -p zvs-studio --all-targets -- -D warnings
      - run: cargo clippy --locked -p zvs-studio --all-targets --features e2e -- -D warnings
      - run: cargo test --locked -p zvs-studio
      - run: pnpm build
      - run: pnpm --filter studio build -- --features e2e
      - run: pnpm test:e2e
        env:
          ZVS_E2E_PREBUILT: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
