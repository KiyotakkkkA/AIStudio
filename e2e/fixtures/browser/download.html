<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Download</title>
  </head>
  <body>
    <h1>Download</h1>
    <a id="download" download="blocked.txt">Download blocked.txt</a>
    <script>
      const link = document.getElementById("download");
      link.href = URL.createObjectURL(new Blob(["blocked"], { type: "text/plain" }));
    </script>
  </body>
</html>
