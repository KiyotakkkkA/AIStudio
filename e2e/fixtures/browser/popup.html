<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Popups</title>
  </head>
  <body>
    <h1>Popups</h1>
    <button id="open" type="button">window.open</button>
    <a href="permissions.html" target="_blank">target=_blank</a>
    <p id="result">waiting</p>
    <script>
      window.addEventListener("message", (event) => {
        document.getElementById("result").textContent = String(event.data);
      });
      document.getElementById("open").addEventListener("click", () => {
        window.open("opener.html");
      });
    </script>
  </body>
</html>
