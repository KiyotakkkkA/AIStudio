[package]
name = "zvs-studio"
version = "1.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "zvs_studio_lib"

[[bin]]
name = "zvs-studio"
path = "src/main.rs"

[[test]]
name = "account_gateway"
harness = false
required-features = ["e2e"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = ["isolation"] }

[features]
e2e = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "=2.12.1", features = ["isolation", "tray-icon", "unstable"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }
zvs-contract = { path = "../../../crates/zvs-contract" }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
zvs-host = { path = "../../../crates/zvs-host" }
zvs-qwen-web = { path = "../../../crates/zvs-qwen-web" }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net", "test-util"] }
zvs-host = { path = "../../../crates/zvs-host", features = ["testing"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "deny"
