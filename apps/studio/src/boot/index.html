<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Обновление данных</title>
  </head>
  <body>
    <main aria-labelledby="boot-title">
      <header class="intro">
        <div class="state-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <ellipse cx="12" cy="6" rx="7" ry="3" />
            <path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" />
          </svg>
        </div>
        <div>
          <p class="eyebrow">Подготовка приложения</p>
          <h1 id="boot-title">Обновление структуры данных</h1>
        </div>
      </header>
      <section class="progress" aria-label="Ход обновления">
        <div class="progress-details" role="status">
          <p id="label">Подготовка…</p>
          <p id="amount" class="amount"></p>
        </div>
        <div class="track" aria-hidden="true"><div id="bar" class="bar"></div></div>
      </section>
    </main>
    <script type="module" src="/boot/main.ts"></script>
  </body>
</html>
